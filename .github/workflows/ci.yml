name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      skip-images:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rag-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: apps/rag-service/uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: |
          uv run pytest --cov=app --cov-report=term --cov-report=markdown:coverage.md
          { echo "### rag-service coverage"; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: |
          npx vitest run --coverage --coverage.reporter=text --coverage.reporter=text-summary | tee coverage.txt
          { echo "### web coverage"; echo '```'; grep -A6 "Coverage summary" coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.117.0
      - run: supabase db start
      - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  images:
    if: ${{ !inputs.skip-images }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: rag-service
            context: apps/rag-service
          - image: web
            context: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
