name: Feature request
description: Propose a change once the idea is concrete enough to build.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: For open-ended ideas, start a thread in Discussions first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behaviour gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Mention the service it touches if you know it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
