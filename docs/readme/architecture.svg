<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-labelledby="title desc">
  <title id="title">Architecture</title>
  <desc id="desc">The browser reaches nginx on a single VPS over HTTPS. nginx terminates TLS and proxies to the web container published on 127.0.0.1 only, with buffering off for the SSE route. Inside docker compose, web (Next.js 16) handles auth, billing, the dashboard and the proxy, and calls rag-service (FastAPI, Python 3.12) over the internal network; rag-service publishes no port. web talks to Stripe for checkout, the portal and signed webhooks, and to Supabase for Auth and reads under RLS; the Stripe webhook writes subscriptions with the service_role key. rag-service talks to Supabase with the service_role key, to the Gemini API for embeddings and generation, and to the GitHub API with a token for public repositories. Boundary 1, session: the Supabase Auth cookie is validated with getUser() in proxy.ts and user_id always comes from the session. Boundary 2, service: a Bearer internal token compared in constant time; only /health answers without it. Release: a push to main reruns the full CI in GitHub Actions (tests, lint, RLS script, gitleaks), publishes both images to GHCR with SHA and semver tags, an SBOM and provenance, and the server pulls them with docker-compose.prod.yml.</desc>
