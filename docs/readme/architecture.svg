    <text x="190" y="517" font-size="12" fill="#8b949e">Supabase Auth cookie validated with <tspan class="mono" fill="#e6edf3">getUser()</tspan> in <tspan class="mono" fill="#e6edf3">proxy.ts</tspan>. <tspan class="mono" fill="#e6edf3">user_id</tspan> always comes from the session.</text>

