    <text x="254" y="306" class="mono" font-size="10" text-anchor="middle" fill="#8b949e">127.0.0.1 only</text>

    <rect x="360.5" y="112.5" width="215" height="109" rx="6" fill="#161b22" stroke="#30363d"/>
