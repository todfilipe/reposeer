<svg xmlns="http://www.w3.org/2000/svg" width="880" height="244" viewBox="0 0 880 244" role="img" aria-labelledby="title desc">
  <title id="title">Quickstart terminal</title>
  <desc id="desc">git clone https://github.com/todfilipe/reposeer.git, cd reposeer, cp .env.example .env then fill apps/web/.env.local and apps/rag-service/.env, docker compose up --build. The web app is on http://localhost:3000 and rag-service stays on the compose network.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
      .t1 { animation: t1 16s infinite; }
      .t2 { animation: t2 16s infinite; }
      .t3 { animation: t3 16s infinite; }
      .t4 { animation: t4 16s infinite; }
      .n3 { animation: n3 16s infinite; }
      .n5 { animation: n5 16s infinite; }
      .g2 { animation: g2 16s infinite; }
      .g3 { animation: g3 16s infinite; }
      .g4 { animation: g4 16s infinite; }
      .g6 { animation: g6 16s infinite; }
      .all { animation: all 16s infinite; }
      .caret { animation: caret 1s steps(1) infinite; }
      @keyframes t1 { 0%, 4% { transform: translateX(0); animation-timing-function: steps(51, end); } 22%, 100% { transform: translateX(398px); } }
      @keyframes g2 { 0%, 24% { opacity: 0; } 24.1%, 100% { opacity: 1; } }
      @keyframes t2 { 0%, 25% { transform: translateX(0); animation-timing-function: steps(11, end); } 31%, 100% { transform: translateX(86px); } }
      @keyframes g3 { 0%, 33% { opacity: 0; } 33.1%, 100% { opacity: 1; } }
      @keyframes t3 { 0%, 34% { transform: translateX(0); animation-timing-function: steps(20, end); } 40%, 100% { transform: translateX(156px); } }
      @keyframes n3 { 0%, 42% { opacity: 0; } 45%, 100% { opacity: 1; } }
      @keyframes g4 { 0%, 50% { opacity: 0; } 50.1%, 100% { opacity: 1; } }
      @keyframes t4 { 0%, 51% { transform: translateX(0); animation-timing-function: steps(25, end); } 59%, 100% { transform: translateX(195px); } }
      @keyframes n5 { 0%, 64% { opacity: 0; } 68%, 100% { opacity: 1; } }
      @keyframes g6 { 0%, 70% { opacity: 0; } 70.1%, 100% { opacity: 1; } }
      @keyframes all { 0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes caret { 0% { opacity: 1; } 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .cover { opacity: 0; }
      }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="243" rx="8" fill="#0d1117" stroke="#30363d"/>
  <path d="M8.5 36.5H871.5" stroke="#30363d"/>
  <circle cx="22" cy="18.5" r="5" fill="#30363d"/>
  <circle cx="39" cy="18.5" r="5" fill="#30363d"/>
  <circle cx="56" cy="18.5" r="5" fill="#30363d"/>
  <text x="440" y="23" class="mono" font-size="12" text-anchor="middle" fill="#8b949e">bash · reposeer</text>

  <g class="mono all" font-size="13">
    <g>
      <text x="24" y="72" fill="#f8a71d">$</text>
      <text x="44" y="72" fill="#e6edf3" textLength="398" lengthAdjust="spacing">git clone https://github.com/todfilipe/reposeer.git</text>
      <rect class="t1 cover" x="44" y="56" width="500" height="22" fill="#0d1117"/>
    </g>
    <g class="g2">
      <text x="24" y="100" fill="#f8a71d">$</text>
      <text x="44" y="100" fill="#e6edf3" textLength="86" lengthAdjust="spacing">cd reposeer</text>
      <rect class="t2 cover" x="44" y="84" width="200" height="22" fill="#0d1117"/>
    </g>
    <g class="g3">
      <text x="24" y="128" fill="#f8a71d">$</text>
      <text x="44" y="128" fill="#e6edf3" textLength="156" lengthAdjust="spacing">cp .env.example .env</text>
      <rect class="t3 cover" x="44" y="112" width="200" height="22" fill="#0d1117"/>
      <text class="n3" x="220" y="128" fill="#8b949e"># then fill apps/web/.env.local and apps/rag-service/.env</text>
    </g>
    <g class="g4">
      <text x="24" y="156" fill="#f8a71d">$</text>
      <text x="44" y="156" fill="#e6edf3" textLength="195" lengthAdjust="spacing">docker compose up --build</text>
      <rect class="t4 cover" x="44" y="140" width="240" height="22" fill="#0d1117"/>
    </g>
    <text class="n5" x="24" y="184" fill="#8b949e"># web on http://localhost:3000 · rag-service only on the compose network</text>
    <g class="g6">
      <text x="24" y="212" fill="#f8a71d">$</text>
      <rect class="caret" x="44" y="200" width="8" height="15" fill="#e6edf3"/>
    </g>
  </g>
</svg>
