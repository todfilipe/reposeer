<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" role="img" aria-labelledby="title desc">
  <title id="title">RAG Codebase Chat</title>
  <desc id="desc">RAG Codebase Chat. Retrieval-augmented answers, grounded in real code. Built by Filipe, open source on GitHub. reposeer.me</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
    </style>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#30363d"/>
    </pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="880" height="132" fill="url(#fade)"/>
    </mask>
    <clipPath id="frame">
      <rect width="880" height="132" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="880" height="132" fill="#161b22"/>
    <rect width="880" height="132" fill="url(#dots)" mask="url(#fadeMask)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="131" rx="7.5" fill="none" stroke="#30363d"/>

  <g transform="translate(28 38) scale(0.3)" fill="none" stroke="#f8a71d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 50C34 17 66 17 92 50C66 83 34 83 8 50Z" stroke-width="6"/>
    <path d="M45.5 35.5C41 35.5 39 37.5 39 42V46C39 48.5 37 50 33 50C37 50 39 51.5 39 54V58C39 62.5 41 64.5 45.5 64.5" stroke-width="6.5"/>
    <path d="M54.5 35.5C59 35.5 61 37.5 61 42V46C61 48.5 63 50 67 50C63 50 61 51.5 61 54V58C61 62.5 59 64.5 54.5 64.5" stroke-width="6.5"/>
  </g>
  <text x="64" y="59" class="sans" font-size="15" font-weight="600" fill="#e6edf3">RAG Codebase Chat</text>
  <text x="28" y="92" class="sans" font-size="12" fill="#8b949e">Retrieval-augmented answers, grounded in real code.</text>

  <text x="852" y="59" class="sans" font-size="12" text-anchor="end" fill="#8b949e">Built by <tspan font-weight="600" fill="#e6edf3">Filipe</tspan> · open source on GitHub</text>
  <text x="852" y="92" class="mono" font-size="12" text-anchor="end" fill="#f8a71d">reposeer.me</text>
</svg>
