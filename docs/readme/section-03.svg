<svg xmlns="http://www.w3.org/2000/svg" width="880" height="92" viewBox="0 0 880 92" role="img" aria-labelledby="title">
  <title id="title">03 / How it works: Two pipelines, one vector store</title>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#30363d"/>
    </pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="880" height="92" fill="url(#fade)"/>
    </mask>
    <clipPath id="frame">
      <rect width="880" height="92" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="880" height="92" fill="#0d1117"/>
    <rect width="880" height="92" fill="url(#dots)" mask="url(#fadeMask)"/>
    <rect x="0" y="28" width="3" height="36" fill="#f8a71d"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="91" rx="7.5" fill="none" stroke="#30363d"/>
  <text x="28" y="36" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#f8a71d">03<tspan fill="#8b949e"> / How it works</tspan></text>
  <text x="28" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.8" fill="#e6edf3">Two pipelines, one vector store</text>
</svg>
