<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" role="img" aria-labelledby="title desc">
  <title id="title">Stack</title>
  <desc id="desc">Product, apps/web: Next.js 16.2, React 19.2, TypeScript 5, Tailwind CSS 4, @supabase/ssr 0.12, Stripe SDK 22. RAG, apps/rag-service: Python 3.12, FastAPI 0.116+, httpx 0.28+, pydantic-settings 2.10+, uvicorn 0.35+, no LangChain and no SDKs. Data and AI: Postgres with pgvector, HNSW cosine index, Supabase Auth with RLS, gemini-embedding-2, gemini-3.1-flash-lite-preview. Ship and test: Docker Compose, uv with ruff and mypy, GitHub Actions, GHCR, pytest, Vitest with ESLint 9.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="343" rx="8" fill="#0d1117" stroke="#30363d"/>

  <g class="mono" font-size="12">
    <text x="24" y="38" font-size="11" letter-spacing="1" fill="#f8a71d">apps/web</text>
    <text x="24" y="58" class="sans" font-size="15" font-weight="600" fill="#e6edf3">Product</text>
    <rect x="24.5" y="76.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="36" y="96" fill="#e6edf3">Next.js</text><text x="206" y="96" text-anchor="end" fill="#8b949e">16.2</text>
    <rect x="24.5" y="116.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="36" y="136" fill="#e6edf3">React</text><text x="206" y="136" text-anchor="end" fill="#8b949e">19.2</text>
    <rect x="24.5" y="156.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="36" y="176" fill="#e6edf3">TypeScript</text><text x="206" y="176" text-anchor="end" fill="#8b949e">5</text>
    <rect x="24.5" y="196.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="36" y="216" fill="#e6edf3">Tailwind CSS</text><text x="206" y="216" text-anchor="end" fill="#8b949e">4</text>
    <rect x="24.5" y="236.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="36" y="256" fill="#e6edf3">@supabase/ssr</text><text x="206" y="256" text-anchor="end" fill="#8b949e">0.12</text>
    <rect x="24.5" y="276.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="36" y="296" fill="#e6edf3">stripe</text><text x="206" y="296" text-anchor="end" fill="#8b949e">22</text>

    <text x="238" y="38" font-size="11" letter-spacing="1" fill="#f8a71d">apps/rag-service</text>
    <text x="238" y="58" class="sans" font-size="15" font-weight="600" fill="#e6edf3">RAG</text>
    <rect x="238.5" y="76.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="250" y="96" fill="#e6edf3">Python</text><text x="420" y="96" text-anchor="end" fill="#8b949e">3.12</text>
    <rect x="238.5" y="116.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="250" y="136" fill="#e6edf3">FastAPI</text><text x="420" y="136" text-anchor="end" fill="#8b949e">0.116+</text>
    <rect x="238.5" y="156.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="250" y="176" fill="#e6edf3">httpx</text><text x="420" y="176" text-anchor="end" fill="#8b949e">0.28+</text>
    <rect x="238.5" y="196.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="250" y="216" fill="#e6edf3">pydantic-settings</text><text x="420" y="216" text-anchor="end" fill="#8b949e">2.10+</text>
    <rect x="238.5" y="236.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="250" y="256" fill="#e6edf3">uvicorn</text><text x="420" y="256" text-anchor="end" fill="#8b949e">0.35+</text>
    <rect x="238.5" y="276.5" width="193" height="30" rx="6" fill="#0d1117" stroke="#f8a71d" stroke-opacity="0.45"/><text x="250" y="296" fill="#f8a71d">no LangChain, no SDKs</text>

    <text x="452" y="38" font-size="11" letter-spacing="1" fill="#f8a71d">supabase/ + Gemini</text>
    <text x="452" y="58" class="sans" font-size="15" font-weight="600" fill="#e6edf3">Data and AI</text>
    <rect x="452.5" y="76.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="464" y="96" fill="#e6edf3">Postgres + pgvector</text>
    <rect x="452.5" y="116.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="464" y="136" fill="#e6edf3">HNSW cosine index</text>
    <rect x="452.5" y="156.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="464" y="176" fill="#e6edf3">Supabase Auth + RLS</text>
    <rect x="452.5" y="196.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="464" y="216" fill="#e6edf3">gemini-embedding-2</text>
    <rect x="452.5" y="236.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="464" y="256" fill="#e6edf3">gemini-3.1-flash-lite</text>
    <rect x="452.5" y="276.5" width="193" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="464" y="296" fill="#e6edf3">5 SQL migrations</text>

    <text x="666" y="38" font-size="11" letter-spacing="1" fill="#f8a71d">.github/ + compose</text>
    <text x="666" y="58" class="sans" font-size="15" font-weight="600" fill="#e6edf3">Ship and test</text>
    <rect x="666.5" y="76.5" width="189" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="678" y="96" fill="#e6edf3">Docker Compose</text>
    <rect x="666.5" y="116.5" width="189" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="678" y="136" fill="#e6edf3">uv + ruff + mypy</text>
    <rect x="666.5" y="156.5" width="189" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="678" y="176" fill="#e6edf3">GitHub Actions</text>
    <rect x="666.5" y="196.5" width="189" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="678" y="216" fill="#e6edf3">GHCR images</text>
    <rect x="666.5" y="236.5" width="189" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="678" y="256" fill="#e6edf3">pytest</text>
    <rect x="666.5" y="276.5" width="189" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text x="678" y="296" fill="#e6edf3">Vitest</text><text x="844" y="296" text-anchor="end" fill="#8b949e">+ ESLint 9</text>
  </g>
</svg>
