<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
  <title id="title">RAG pipeline</title>
  <desc id="desc">Indexing, POST /index: GitHub API reads the tree and blobs without cloning; files are filtered by 34 extensions and 100 KB and diffed by git blob SHA; chunked into 2000 characters with 200 overlap; embedded with gemini-embedding-2 at 768 dimensions in batches of 25; stored in code_chunks and indexed_files. Both flows share Supabase Postgres with pgvector, an HNSW cosine index, rows scoped by repo_id and user_id. Question, POST /query: user_id from the session; question embedded with the same model; match_chunks returns the top 5 with no cutoff; gemini-3.1-flash-lite-preview generates; the answer streams over SSE as sources, then token events, then done.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 4 10; animation: flow 2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="479" rx="8" fill="#0d1117" stroke="#30363d"/>

  <text x="32" y="38" class="mono" font-size="11" letter-spacing="1.2" fill="#f8a71d">INDEXING <tspan fill="#8b949e">· POST /index · background task after 202</tspan></text>
  <line class="flow" x1="40" y1="97" x2="840" y2="97" stroke="#f8a71d" stroke-opacity="0.6" stroke-width="1.5"/>
  <path class="flow" d="M774 142V188" fill="none" stroke="#f8a71d" stroke-opacity="0.6" stroke-width="1.5"/>

  <g class="sans">
    <rect x="32.5" y="52.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="45" y="73" class="mono" font-size="10" fill="#f8a71d">01</text>
    <text x="45" y="93" font-size="13" font-weight="600" fill="#e6edf3">GitHub API</text>
    <text x="45" y="113" class="mono" font-size="10.5" fill="#8b949e">tree + blobs</text>
    <text x="45" y="129" class="mono" font-size="10.5" fill="#8b949e">no git clone</text>

    <rect x="199.5" y="52.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="212" y="73" class="mono" font-size="10" fill="#f8a71d">02</text>
    <text x="212" y="93" font-size="13" font-weight="600" fill="#e6edf3">Filter + diff</text>
    <text x="212" y="113" class="mono" font-size="10.5" fill="#8b949e">34 ext · ≤100 KB</text>
    <text x="212" y="129" class="mono" font-size="10.5" fill="#8b949e">blob SHA vs stored</text>

    <rect x="366.5" y="52.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="379" y="73" class="mono" font-size="10" fill="#f8a71d">03</text>
    <text x="379" y="93" font-size="13" font-weight="600" fill="#e6edf3">Chunk</text>
    <text x="379" y="113" class="mono" font-size="10.5" fill="#8b949e">2000 chars</text>
    <text x="379" y="129" class="mono" font-size="10.5" fill="#8b949e">200 overlap + lines</text>

    <rect x="533.5" y="52.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="546" y="73" class="mono" font-size="10" fill="#f8a71d">04</text>
    <text x="546" y="93" font-size="13" font-weight="600" fill="#e6edf3">Embed</text>
    <text x="546" y="113" class="mono" font-size="10.5" fill="#8b949e">gemini-embedding-2</text>
    <text x="546" y="129" class="mono" font-size="10.5" fill="#8b949e">768-dim · batch 25</text>

    <rect x="700.5" y="52.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="713" y="73" class="mono" font-size="10" fill="#f8a71d">05</text>
    <text x="713" y="93" font-size="13" font-weight="600" fill="#e6edf3">Store</text>
    <text x="713" y="113" class="mono" font-size="10.5" fill="#8b949e">code_chunks</text>
    <text x="713" y="129" class="mono" font-size="10.5" fill="#8b949e">+ indexed_files</text>
  </g>

  <rect x="32.5" y="188.5" width="815" height="54" rx="6" fill="#161b22" stroke="#f8a71d" stroke-opacity="0.45"/>
  <g transform="translate(48 203) scale(1)" fill="none" stroke="#f8a71d" stroke-width="1.5">
    <ellipse cx="12" cy="5" rx="9" ry="3.5"/>
    <path d="M3 5v14c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5V5"/>
    <path d="M3 12c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5"/>
  </g>
  <text x="84" y="212" class="sans" font-size="13" font-weight="600" fill="#e6edf3">Supabase Postgres + pgvector</text>
  <text x="84" y="231" class="mono" font-size="10.5" fill="#8b949e">vector(768) · HNSW vector_cosine_ops · every row scoped by repo_id and user_id</text>

  <text x="32" y="280" class="mono" font-size="11" letter-spacing="1.2" fill="#f8a71d">QUESTION <tspan fill="#8b949e">· POST /query · streamed</tspan></text>
  <line class="flow" x1="40" y1="339" x2="840" y2="339" stroke="#f8a71d" stroke-opacity="0.6" stroke-width="1.5"/>
  <path class="flow" d="M440 243V294" fill="none" stroke="#f8a71d" stroke-opacity="0.6" stroke-width="1.5"/>

  <g class="sans">
    <rect x="32.5" y="294.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="45" y="315" class="mono" font-size="10" fill="#f8a71d">01</text>
    <text x="45" y="335" font-size="13" font-weight="600" fill="#e6edf3">Question</text>
    <text x="45" y="355" class="mono" font-size="10.5" fill="#8b949e">user_id from</text>
    <text x="45" y="371" class="mono" font-size="10.5" fill="#8b949e">the session</text>

    <rect x="199.5" y="294.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="212" y="315" class="mono" font-size="10" fill="#f8a71d">02</text>
    <text x="212" y="335" font-size="13" font-weight="600" fill="#e6edf3">Embed</text>
    <text x="212" y="355" class="mono" font-size="10.5" fill="#8b949e">same model</text>
    <text x="212" y="371" class="mono" font-size="10.5" fill="#8b949e">768-dim vector</text>

    <rect x="366.5" y="294.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="379" y="315" class="mono" font-size="10" fill="#f8a71d">03</text>
    <text x="379" y="335" font-size="13" font-weight="600" fill="#e6edf3">Retrieve</text>
    <text x="379" y="355" class="mono" font-size="10.5" fill="#8b949e">match_chunks</text>
    <text x="379" y="371" class="mono" font-size="10.5" fill="#8b949e">top-k 5, no cutoff</text>

    <rect x="533.5" y="294.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="546" y="315" class="mono" font-size="10" fill="#f8a71d">04</text>
    <text x="546" y="335" font-size="13" font-weight="600" fill="#e6edf3">Generate</text>
    <text x="546" y="355" class="mono" font-size="10.5" fill="#8b949e">gemini-3.1-</text>
    <text x="546" y="371" class="mono" font-size="10.5" fill="#8b949e">flash-lite-preview</text>

    <rect x="700.5" y="294.5" width="147" height="89" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="713" y="315" class="mono" font-size="10" fill="#f8a71d">05</text>
    <text x="713" y="335" font-size="13" font-weight="600" fill="#e6edf3">Stream</text>
    <text x="713" y="355" class="mono" font-size="10.5" fill="#8b949e">SSE through</text>
    <text x="713" y="371" class="mono" font-size="10.5" fill="#8b949e">web + nginx</text>
  </g>

  <line x1="32" y1="408.5" x2="848" y2="408.5" stroke="#30363d"/>
  <text x="32" y="442" class="mono" font-size="11" fill="#8b949e">order on the wire</text>
  <g class="mono" font-size="11">
    <rect x="160.5" y="425.5" width="118" height="26" rx="6" fill="#161b22" stroke="#f8a71d" stroke-opacity="0.45"/>
    <text x="219.5" y="442.5" text-anchor="middle" fill="#f8a71d">event: sources</text>
    <path d="M286 438.5h18M298 433.5l6 5-6 5" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="312.5" y="425.5" width="136" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="380.5" y="442.5" text-anchor="middle" fill="#e6edf3">event: token …</text>
    <path d="M456 438.5h18M468 433.5l6 5-6 5" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="482.5" y="425.5" width="164" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="564.5" y="442.5" text-anchor="middle" fill="#e6edf3">event: done | error</text>
  </g>
  <text x="848" y="442" class="sans" font-size="12" text-anchor="end" fill="#8b949e">sources land before the first token</text>
</svg>
